[workspace]
resolver = "2"
members = [
    "crates/wireaudio-core",
    "crates/wireaudio-alsa",
    "crates/wireaudio-engine",
    "crates/wireaudio-pcm-plugin",
    "crates/wireaudio-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Andrei Romanov <ansromanov@users.noreply.github.com>"]
repository = "https://github.com/ansromanov/wireaudio"

[workspace.dependencies]
alsa = "0.9.1"
alsa-sys = "0.3.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
